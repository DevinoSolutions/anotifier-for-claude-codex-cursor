name: Bug report
description: Something doesn't work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the steps that led to it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04, WSL2 on Windows 11
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: AI agent tool
      multiple: true
      options:
        - Claude Code
        - Codex CLI
        - Cursor
        - Gemini CLI
        - Not tool-specific
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`anotifier doctor` output"
      description: Paste the full output. Add `--deep` if the problem is a notification not arriving.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: anotifier version
      description: "Output of `anotifier --version`"
    validations:
      required: false
