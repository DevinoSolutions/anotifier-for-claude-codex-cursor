name: Approval (real ntfy)

# Remote approval against a REAL ntfy server set up with the ACL recipe of
# docs/design/remote-approval.md 2.5: deny-all, an `agent` user that may only
# write the request topic and read the response topics, a `phone` user that
# may only read the request topic, anonymous write-only on the response
# topics, and an agent access token. Hermetic: the server runs on the runner,
# nothing reaches ntfy.sh.
#
# The server runs with `docker run` in a step rather than as a `services:`
# container: the ntfy image needs the `serve` argument, and service
# containers cannot be given one.
on:
  push:
    branches: [main]
    paths:
      - 'src/approve*.mjs'
      - 'src/approval*.mjs'
      - 'cli/approval.mjs'
      - 'cli/away.mjs'
      - 'scripts/approval/**'
      - 'tests/approval*.mjs'
      - 'tests/approve*.mjs'
      - 'tests/e2e/approval-ntfy.e2e.test.mjs'
      - '.github/workflows/approval-ntfy.yml'
  pull_request:
    paths:
      - 'src/approve*.mjs'
      - 'src/approval*.mjs'
      - 'cli/approval.mjs'
      - 'cli/away.mjs'
      - 'scripts/approval/**'
      - 'tests/approval*.mjs'
      - 'tests/approve*.mjs'
      - 'tests/e2e/approval-ntfy.e2e.test.mjs'
      - '.github/workflows/approval-ntfy.yml'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approval-ntfy:
    name: Approval vs ntfy v2.29.0 (ACL recipe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install

      - name: Start ntfy with deny-all, users, ACLs and an agent token
        run: |
          set -euo pipefail
          # v2.29.0 pinned by digest (the multi-arch manifest list from Docker Hub,
          # checked against the registry Docker-Content-Digest header), so a moved tag
          # cannot change the server under test.
          docker run -d --name ntfy -p 127.0.0.1:2586:80 \
            -e NTFY_BASE_URL=http://127.0.0.1:2586 \
            -e NTFY_AUTH_FILE=/tmp/user.db \
            -e NTFY_AUTH_DEFAULT_ACCESS=deny-all \
            binwiederhier/ntfy:v2.29.0@sha256:4c599cf0818965782f93f652bd843e92714992e84d6b88ad17713dc0951cda1f serve
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2586/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:2586/v1/health

          # This install's names, generated by the product code itself.
          REQ=$(node -e "import('./src/approval.mjs').then((m) => console.log(m.generateRequestTopic()))")
          PREFIX=$(node -e "import('./src/approval.mjs').then((m) => console.log(m.generateResponsePrefix()))")
          AGENT_PASS=$(openssl rand -hex 16)
          PHONE_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$AGENT_PASS"
          echo "::add-mask::$PHONE_PASS"

          docker exec -e NTFY_PASSWORD="$AGENT_PASS" ntfy ntfy user add agent
          docker exec -e NTFY_PASSWORD="$PHONE_PASS" ntfy ntfy user add phone
          # Each account needs a tier. ntfy keys a tierless user's rate-limit
          # visitor by IP and overwrites its user on every request, so two
          # accounts (or an account and an anonymous client) on one IP can be
          # authorized as each other. Here the hook and the phone sim share
          # 127.0.0.1, which gave the phone an intermittent 403.
          # Design 2.5, step 1.
          docker exec ntfy ntfy tier add --name=approval approval
          docker exec ntfy ntfy user change-tier agent approval
          docker exec ntfy ntfy user change-tier phone approval
          docker exec ntfy ntfy access agent "$REQ" write-only
          docker exec ntfy ntfy access phone "$REQ" read-only
          docker exec ntfy ntfy access everyone "${PREFIX}_*" write-only
          docker exec ntfy ntfy access agent "${PREFIX}_*" read-only
          # A topic anyone can read and write, to prove the setup lockdown
          # probe refuses an open server.
          OPEN=$(node -e "import('./src/approval.mjs').then((m) => console.log(m.generateRequestTopic()))")
          docker exec ntfy ntfy access everyone "$OPEN" read-write
          TOKEN=$(docker exec ntfy ntfy token add --expires=1d --label=anotifier-ci agent | grep -o 'tk_[A-Za-z0-9]*' | head -n1)
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          docker exec ntfy ntfy access

          {
            echo "AAN_APPROVAL_NTFY_URL=http://127.0.0.1:2586"
            echo "AAN_APPROVAL_AGENT_TOKEN=$TOKEN"
            echo "AAN_APPROVAL_REQUEST_TOPIC=$REQ"
            echo "AAN_APPROVAL_OPEN_TOPIC=$OPEN"
            echo "AAN_APPROVAL_RESPONSE_PREFIX=$PREFIX"
            echo "AAN_APPROVAL_PHONE_USER=phone"
            echo "AAN_APPROVAL_PHONE_PASS=$PHONE_PASS"
          } >> "$GITHUB_ENV"

      - name: Approve / deny / expiry / forged / replay / concurrent against the real server
        run: node --test tests/e2e/approval-ntfy.e2e.test.mjs

      - name: Fault injection (fake server, same invariant)
        run: node --test tests/approve-faults.test.mjs

      - name: ntfy server log
        if: failure()
        run: docker logs ntfy
