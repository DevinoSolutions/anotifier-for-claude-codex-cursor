# Builds the landing site image (landing/Dockerfile, anotifier.io) ONCE per commit on a GitHub-hosted runner, pushes it to GHCR by
# digest and publishes a Dokploy release. Dokploy never builds the landing site from source once this file is live: it polls GitHub
# (outbound only), reads the release, checks it against this run and deploys the digest. This file holds no Dokploy address and no
# Dokploy API key. The only step that talks to the Dokploy contract is the public action DevinoSolutions/dokploy-release. Same shape as
# Caramel (DevinoSolutions/caramel #697) and UpUp (DevinoSolutions/UpUp #690).
#
# ONE ENVIRONMENT. The repository has one branch that deploys: main -> GitHub Environment `production` -> the Dokploy application
# "landing" (release key `anotifier-landing`). A push to main that touches landing/ (or this file), or a manual run on main, builds that
# commit once and publishes one release. Nothing reaches a server until the Dokploy application has a Connect for that key (Dokploy
# Settings, GitHub Actions); the Connect, not this file, decides whether a release is deployed. Pull requests are not built here: the
# Landing workflow (landing.yml) already builds the same site and serves it with the production nginx.conf before merge.
#
# WHY HOSTED RUNNERS. This repository is PUBLIC; the organisation self-hosted runner group refuses public repositories. Nothing here
# needs the private network: the image goes to GHCR (a public package, so Dokploy pulls without a credential) and the release is a
# GitHub Deployment plus a manifest line in the release job log that Dokploy reads itself.
#
# THE IMAGE. ghcr.io/devinosolutions/anotifier-for-claude-codex-cursor/landing, tagged sha-<first 12 of the commit>. The four
# NEXT_PUBLIC_* values the Dockerfile declares as build arguments (Google Analytics id, PostHog key and host, Sentry DSN) are inlined
# into the browser bundle at build time. They are public client values, so they are repository VARIABLES with the same names as the
# build arguments, not secrets. A variable that is empty or unset is left out of the build, so the Dockerfile default (empty: no
# tracker) applies. WHEN A VALUE CHANGES, CHANGE THE SAME REPOSITORY VARIABLE, or the next build keeps the old one. The package must
# be PUBLIC (Settings of the package on GitHub), set once after the first publish.
#
# THE RELEASE. After the image is pushed and verified, the `release` job publishes ONE release for the application: the key is
# `anotifier-landing` and the image is taken from a job output of THIS run (a tag is refused). The manifest is read from the release
# job log (`upload-artifact: false`). Only the release job names an environment: production, with a deployment branch policy (main) that
# Dokploy re-reads at every acceptance.
#
# Layer cache: GitHub own (type=gha, mode=min to stay inside the repository cache quota).
name: Dokploy
on:
  push:
    branches: [main]
    paths:
      - landing/**
      - .github/workflows/dokploy.yml
  workflow_dispatch:
concurrency:
  # One run per ref; a newer push waits behind the running one. Never cancel a run that may be publishing a release.
  group: dokploy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: build landing
    # main only, on push or by a manual run; any other ref is skipped.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `environment:` here on purpose: it would create a GitHub Deployment for the build.
    permissions:
      contents: read
      packages: write
    outputs:
      digest_landing: ${{ steps.verify.outputs.digest_landing }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Collect the build arguments
        id: args
        env:
          # The ARG lines of landing/Dockerfile, nothing else.
          NAMES: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID NEXT_PUBLIC_POSTHOG_KEY NEXT_PUBLIC_POSTHOG_HOST NEXT_PUBLIC_SENTRY_DSN
          # Repository variables only. Public client values, not secrets.
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          set_names=()
          {
            echo 'build-args<<EOF_BUILD_ARGS'
            for name in ${NAMES}; do
              value="$(printf '%s' "${VARS_JSON}" | jq -r --arg key "${name}" '.[$key] // ""')"
              case "${value}" in *$'\n'*|*$'\r'*) echo "::error::variable ${name} is not a single line" >&2; exit 1 ;; esac
              # An empty argument would clobber the Dockerfile default: leave it out instead.
              [ -z "${value}" ] || { set_names+=("${name}"); echo "${name}=${value}"; }
            done
            echo 'EOF_BUILD_ARGS'
          } >> "${GITHUB_OUTPUT}"
          echo "build args set from repository variables (names only): ${set_names[*]:-none}"
          echo "tag=sha-${GITHUB_SHA:0:12}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and push landing
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: landing
          file: landing/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/devinosolutions/anotifier-for-claude-codex-cursor/landing:${{ steps.args.outputs.tag }}
          build-args: ${{ steps.args.outputs.build-args }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=anotifier-landing
          cache-to: type=gha,mode=min,scope=anotifier-landing
      - name: Check that GHCR serves the pushed digest
        id: verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest from the build"; exit 1; }
          ref="ghcr.io/devinosolutions/anotifier-for-claude-codex-cursor/landing@${DIGEST}"
          raw=''
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect --raw "${ref}" > "${RUNNER_TEMP}/manifest.raw"; then
              raw="sha256:$(sha256sum "${RUNNER_TEMP}/manifest.raw" | cut -d' ' -f1)"; break
            fi
            sleep $((attempt * 5))
          done
          [ "${raw}" = "${DIGEST}" ] || { echo "::error::GHCR does not serve the pushed manifest by its digest"; exit 1; }
          # Dokploy pulls without a credential: prove the package is public with an anonymous token and a manifest HEAD.
          code=000
          for attempt in 1 2 3; do
            token="$(curl -fsS "https://ghcr.io/token?scope=repository:devinosolutions/anotifier-for-claude-codex-cursor/landing:pull" | jq -r '.token // empty' || true)"
            code="$(curl -s -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer ${token}" -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/devinosolutions/anotifier-for-claude-codex-cursor/landing/manifests/${DIGEST}" || true)"
            [ "${code}" = 200 ] && break
            sleep $((attempt * 5))
          done
          [ "${code}" = 200 ] || { echo "::error::ghcr.io/devinosolutions/anotifier-for-claude-codex-cursor/landing is not pullable anonymously (HTTP ${code}); make the package public"; exit 1; }
          echo "digest_landing=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "- \`${ref}\`" >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: publish the Dokploy release
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with an environment: its deployment branch policy gates the release and Dokploy re-reads that policy.
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Compose the image reference
        id: images
        env:
          DIGEST_LANDING: ${{ needs.build.outputs.digest_landing }}
        run: |
          set -euo pipefail
          [[ "${DIGEST_LANDING}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for landing from the build job"; exit 1; }
          echo "image=ghcr.io/devinosolutions/anotifier-for-claude-codex-cursor/landing@${DIGEST_LANDING}" >> "${GITHUB_OUTPUT}"
      - uses: DevinoSolutions/dokploy-release@d66a2e9a36c7c154f92f9aa18b7f7aced6e73b77 # v1.1.0
        with:
          service: anotifier-landing
          environment: production
          delivery: pull
          # Policy: no actions/upload-artifact in this workflow. Dokploy reads the manifest line from this job log.
          upload-artifact: 'false'
          existing-image: ${{ steps.images.outputs.image }}
