# Landing site (anotifier.io) — source lives in landing/.
#
# Runs only when the site changes. Dokploy builds and deploys landing/ from
# main on its own; this workflow is the pre-merge gate (lint, format, unused
# code, types, static export). Every check step carries `if: ${{ !cancelled() }}`
# so one red check never hides the others.
name: Landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  # Supersede runs on every ref, main included. This workflow is the pre-merge
  # gate and nothing else — Dokploy builds and deploys landing/ from main on its
  # own — so a run against a commit that a newer push has already replaced is
  # holding a runner for a result nobody reads.
  cancel-in-progress: true

defaults:
  run:
    working-directory: landing

jobs:
  site:
    name: Landing (lint · format · knip · typecheck · build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format check (prettier)
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Unused code & deps (knip)
        if: ${{ !cancelled() }}
        run: npm run knip

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Build (static export)
        if: ${{ !cancelled() }}
        run: npm run build

      # The same image and nginx.conf production runs, so redirects, 404s and
      # headers are tested for real, not just the HTML.
      - name: Serve the export with the production nginx.conf
        if: ${{ !cancelled() }}
        run: |
          docker run -d --name site -p 8080:80 \
            -v "$PWD/out:/usr/share/nginx/html:ro" \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && exit 0; sleep 1; done
          docker logs site
          exit 1

      - name: Site tests (HTTP + real Chrome)
        if: ${{ !cancelled() }}
        env:
          BASE_URL: http://localhost:8080
        run: npm run test:site
