name: Unit

# Deliberately NO landing/** path filter, unlike the other CLI lanes: `npm test` reads the
# site. tests/community.test.mjs walks the whole repo (landing/ included) for a non-canonical
# Discord invite and pins landing/lib/site.ts; tests/brand-icons.test.mjs pins landing/ icons,
# channels.ts and the footers. A landing-only PR can break either one.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit + integration tests
        run: npm test
        env:
          # live Sentry delivery test runs on ONE leg (ubuntu, node 22): one leg proves delivery, the others would only flood the prod Sentry project; empty = auto-skip
          AAN_SENTRY_TEST_DSN: ${{ (matrix.os == 'ubuntu-latest' && matrix.node == 22) && secrets.AAN_SENTRY_TEST_DSN || '' }}

  # One extra leg, ubuntu + newest node only: the same suite with every non-loopback
  # connection refused (tests/offline-preload.cjs, inherited by spawned children through
  # NODE_OPTIONS). The hook and the CLI swallow network errors on purpose, so a refused
  # connection does not by itself fail a test: the preload also appends one line per refused
  # connection to TRAP_LOG, and the second step fails the job if that log is not empty.
  # No AAN_SENTRY_TEST_DSN: the live Sentry delivery test needs the network.
  unit-offline:
    name: Unit (network blocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Unit + integration tests, network blocked
        # absolute path on purpose: tests spawn children with other working directories
        run: npm test
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/offline-preload.cjs
          TRAP_LOG: ${{ runner.temp }}/net.log
      - name: Fail if anything tried to reach the network
        # always(): print the log even when the tests themselves failed
        if: ${{ always() }}
        run: |
          if [ -s "$RUNNER_TEMP/net.log" ]; then
            echo "::error::a test, or a process it spawned, tried to connect to a non-loopback host:"
            cat "$RUNNER_TEMP/net.log"
            exit 1
          fi
