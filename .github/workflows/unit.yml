name: Unit

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Unit + integration tests
        run: npm test
        env:
          # live Sentry delivery test runs on ONE leg (ubuntu, node 22): one leg proves delivery, the others would only flood the prod Sentry project; empty = auto-skip
          AAN_SENTRY_TEST_DSN: ${{ (matrix.os == 'ubuntu-latest' && matrix.node == 22) && secrets.AAN_SENTRY_TEST_DSN || '' }}
