server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;
    # nginx defaults to level 1. Cloudflare caches and passes through the
    # origin's gzip for /_next/static, so this level is what visitors get:
    # level 6 ships the React + Next runtime ~19 KB smaller (64 -> 54 KB and
    # 55 -> 47 KB), all of it on the mobile first-load path.
    gzip_comp_level 6;

    # Content-Security-Policy-Report-Only is observe-only, never enforcing:
    # violations go to Sentry project 67. 'unsafe-inline' covers Next's inline
    # RSC payload and JSON-LD scripts and styles.
    # Security headers. nginx drops these in any location that sets its own
    # add_header, so each such location below repeats the full set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:; report-uri https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e; report-to csp-endpoint" always;
    add_header Reporting-Endpoints 'csp-endpoint="https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e"' always;

    error_page 404 /404.html;

    # Relative Location headers: behind the TLS proxy an absolute one would
    # say http:// and cost visitors an extra hop.
    absolute_redirect off;

    # One URL per page: /docs/index.html -> /docs/. Matches the ORIGINAL
    # request only ($request_uri), so the index directive's internal redirect
    # to index.html can never loop back here.
    if ($request_uri ~ "^(?<dir>[^?]*/)index\.html(?<qs>\?.*)?$") {
        return 301 $dir$qs;
    }

    # First-party PostHog. The browser SDK talks to /_t/n4q/ on anotifier.io
    # (components/PostHog.tsx) and nginx forwards it to the self-hosted
    # instance, so blocklists that match PostHog hostnames or paths miss it
    # (UpRank does the same with /ingest). The host sits in a variable so it is
    # resolved per request: a DNS hiccup at container start cannot stop nginx.
    # Cookies stay on anotifier.io. No add_header here, so the server-level
    # security headers apply.
    location ^~ /_t/n4q/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $posthog posthog.devino.ca;
        rewrite ^/_t/n4q/(.*)$ /$1 break;
        proxy_pass https://$posthog;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $posthog;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        client_max_body_size 5m;
    }

    # First-party Google Analytics. components/GoogleAnalytics.tsx loads
    # gtag.js from /gx4t/ and sets transport_url to /gx4t, so its hits come to
    # /gx4t/g/collect; nginx relays both to Google. proxy_pass_request_headers
    # off drops every request header (X-Forwarded-For, CF-Connecting-IP,
    # Cookie, Referer...) except the few set below, so the request carries no
    # visitor IP header; Google connects from this server. Both locations
    # accept our measurement id only, and only these two upstream paths exist.
    # Google's Strict-Transport-Security (includeSubDomains) and Alt-Svc would
    # otherwise reach visitors ahead of ours, so they are hidden. This
    # replaces Cloudflare's Google Tag Gateway, which injected the tag into
    # every page before consent and cannot be told not to (it is off).
    location = /gx4t/ {
        limit_except GET {
            deny all;
        }
        if ($arg_id != "G-TT12DKE7H6") {
            return 404;
        }
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $gtm www.googletagmanager.com;
        proxy_pass https://$gtm/gtag/js?id=G-TT12DKE7H6;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $gtm;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_set_header Host $gtm;
        proxy_set_header User-Agent $http_user_agent;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Alt-Svc;
    }

    location = /gx4t/g/collect {
        limit_except GET POST {
            deny all;
        }
        if ($arg_tid != "G-TT12DKE7H6") {
            return 404;
        }
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $ga www.google-analytics.com;
        proxy_pass https://$ga/g/collect$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $ga;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_set_header Host $ga;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Content-Type $content_type;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Alt-Svc;
        client_max_body_size 64k;
    }

    # First-party Sentry tunnel. The browser SDK (components/SentryReplay.tsx,
    # `tunnel: "/_t/s7e"`) POSTs its envelopes here and nginx relays them to the
    # self-hosted Sentry, so blocklists that match Sentry hostnames drop
    # nothing. The upstream path is fixed to project 67 (anotifier-landing):
    # whatever DSN a request carries, this location cannot relay to any other
    # project. POST only, 2 MB cap (replay segments are the large ones). No
    # cookies in either direction, and no add_header here, so the server-level
    # security headers apply.
    location = /_t/s7e {
        limit_except POST {
            deny all;
        }
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $sentry sentry.devino.ca;
        proxy_pass https://$sentry/api/67/envelope/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $sentry;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $sentry;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        client_max_body_size 2m;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:; report-uri https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e; report-to csp-endpoint" always;
        add_header Reporting-Endpoints 'csp-endpoint="https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e"' always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:; report-uri https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e; report-to csp-endpoint" always;
        add_header Reporting-Endpoints 'csp-endpoint="https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e"' always;
    }

    # Per-page share images (app/**/opengraph-image.tsx, twitter-image.tsx)
    # export as extensionless files; link scrapers want a real image type.
    location ~ /(opengraph|twitter)-image$ {
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:; report-uri https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e; report-to csp-endpoint" always;
        add_header Reporting-Endpoints 'csp-endpoint="https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e"' always;
        try_files $uri =404;
    }

    # Pages (and the 404 page, which error_page serves through here, hence
    # `always`: without it nginx sends the header on 2xx/3xx only).
    # no-transform stops Cloudflare from rewriting the HTML: it keeps the Web
    # Analytics beacon (static.cloudflareinsights.com) out if that is ever
    # turned back on (Cloudflare's Web Analytics FAQ names exactly
    # `public, no-transform` as stopping its automatic setup). It does NOT stop
    # the Google Tag Gateway, which injected GA into pages for browser user
    # agents before consent even with this header; the gateway is off and
    # /gx4t is relayed by nginx above. `public` adds no caching:
    # Cloudflare does not cache HTML by default. no-transform also stops
    # Cloudflare compressing the page (no brotli), so visitors get nginx's gzip
    # above (text/html is always on the list).
    location / {
        add_header Cache-Control "public, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:; report-uri https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e; report-to csp-endpoint" always;
        add_header Reporting-Endpoints 'csp-endpoint="https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e"' always;

        # /docs -> /docs/ (the canonical, trailingSlash export). The regex
        # only matches paths without a trailing slash, so it cannot loop.
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/index.html =404;
    }
}
