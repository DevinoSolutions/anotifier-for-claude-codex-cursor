server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;
    # nginx defaults to level 1. Cloudflare caches and passes through the
    # origin's gzip for /_next/static, so this level is what visitors get:
    # level 6 ships the React + Next runtime ~19 KB smaller (64 -> 54 KB and
    # 55 -> 47 KB), all of it on the mobile first-load path.
    gzip_comp_level 6;

    # Content-Security-Policy-Report-Only is observe-only, never enforcing:
    # violations go to Sentry project 67. 'unsafe-inline' covers Next's inline
    # RSC payload and JSON-LD scripts and styles.
    # Security headers. nginx drops these in any location that sets its own
    # add_header, so each such location below repeats the full set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://posthog.devino.ca; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://posthog.devino.ca https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e; report-to csp-endpoint" always;
    add_header Reporting-Endpoints 'csp-endpoint="https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e"' always;

    error_page 404 /404.html;

    # Relative Location headers: behind the TLS proxy an absolute one would
    # say http:// and cost visitors an extra hop.
    absolute_redirect off;

    # One URL per page: /docs/index.html -> /docs/. Matches the ORIGINAL
    # request only ($request_uri), so the index directive's internal redirect
    # to index.html can never loop back here.
    if ($request_uri ~ "^(?<dir>[^?]*/)index\.html(?<qs>\?.*)?$") {
        return 301 $dir$qs;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://posthog.devino.ca; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://posthog.devino.ca https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e; report-to csp-endpoint" always;
        add_header Reporting-Endpoints 'csp-endpoint="https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e"' always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://posthog.devino.ca; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://posthog.devino.ca https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e; report-to csp-endpoint" always;
        add_header Reporting-Endpoints 'csp-endpoint="https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e"' always;
    }

    # Per-page share images (app/**/opengraph-image.tsx, twitter-image.tsx)
    # export as extensionless files; link scrapers want a real image type.
    location ~ /(opengraph|twitter)-image$ {
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://posthog.devino.ca; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://posthog.devino.ca https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e; report-to csp-endpoint" always;
        add_header Reporting-Endpoints 'csp-endpoint="https://sentry.devino.ca/api/67/security/?sentry_key=e21aa0bbfe20dd9af962a439a345522e"' always;
        try_files $uri =404;
    }

    location / {
        # /docs -> /docs/ (the canonical, trailingSlash export). The regex
        # only matches paths without a trailing slash, so it cannot loop.
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/index.html =404;
    }
}
